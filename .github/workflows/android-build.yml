name: Android Build

on:
  push:
    branches: [android]
    paths: ['Se7enProAndroid/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Se7enProAndroid
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Fetch sing-box engine binaries
        run: bash scripts/fetch-engine.sh

      - name: Build APK (release variant)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK artifacts
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Se7enPro-Android-APK
          path: out/*.apk
          retention-days: 30

      # Note: releases are published manually with the release-signed APKs.
      # CI builds are debug-signed (no keystore in CI) — never publish them automatically.
